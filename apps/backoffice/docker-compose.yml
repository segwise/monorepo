services:
  backoffice:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXT_PUBLIC_ROLE_SYSTEM: backoffice
    networks:
      - dokploy-network
    restart: unless-stopped

  customer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXT_PUBLIC_ROLE_SYSTEM: customer
    networks:
      - dokploy-network
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      NEXT_PUBLIC_ROLE_SYSTEM: producer
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true