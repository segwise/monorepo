name: CI

on:
  pull_request:
    # labeled/unlabeled: a label pdf-visual-change muda o resultado da comparação visual dos PDFs.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  # O build do backoffice embute NEXT_PUBLIC_* — valores fictícios, só para compilar.
  NEXT_PUBLIC_ROLE_SYSTEM: admin
  NEXT_PUBLIC_API_URL: http://localhost:3000

jobs:
  verify:
    name: Lint, typecheck e build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # O CSS dos PDFs é gerado e versionado (antes vinha do CDN do Tailwind a cada PDF): falha se
      # alguém mudou classes nos templates sem rodar `bun run pdf:styles` em apps/api.
      - name: CSS dos PDFs em dia
        run: |
          bun run --cwd apps/api pdf:styles
          git diff --exit-code -- apps/api/src/libraries/pdf/styles.generated.ts \
            || { echo "::error::Rode 'bun run pdf:styles' em apps/api e comite styles.generated.ts"; exit 1; }

      # Em PR roda só o que mudou em relação à base; em push na main roda tudo.
      - name: turbo run lint typecheck build (afetados)
        if: github.event_name == 'pull_request'
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
        run: bunx turbo run lint typecheck build --affected --cache-dir=.turbo

      - name: turbo run lint typecheck build (tudo)
        if: github.event_name != 'pull_request'
        run: bunx turbo run lint typecheck build --cache-dir=.turbo

  database:
    name: Prisma (validate + migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile --filter @segwise/database

      - name: prisma validate
        working-directory: packages/database
        run: bun x --bun prisma validate

      # Aplica TODAS as migrations do zero: pega SQL quebrado, ordem errada e
      # CREATE INDEX CONCURRENTLY junto de outros comandos na mesma migration.
      - name: prisma migrate deploy (banco vazio)
        working-directory: packages/database
        run: bun x --bun prisma migrate deploy

  docker:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dir: apps/api
          - app: backoffice
            dir: apps/backoffice
          - app: pdf
            dir: apps/pdf
          - app: migrate
            dir: packages/database
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            docker:
              - '${{ matrix.dir }}/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.docker == 'true'

      - name: Build da imagem (sem publicar)
        if: github.event_name != 'pull_request' || steps.changes.outputs.docker == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dir }}/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_ROLE_SYSTEM=admin
            NEXT_PUBLIC_API_URL=http://localhost:3000
          # api, pdf e migrate buildam igual no CI e no CD: o escopo é compartilhado e o CD reaproveita o que
          # o CI da main já buildou. O backoffice NÃO: aqui ele usa a URL de API fictícia, e gravar no escopo
          # do CD sobrescreveria o cache dele (o CD refaria o `next build` a cada deploy). Escopo próprio.
          cache-from: type=gha,scope=${{ matrix.app == 'backoffice' && 'ci-backoffice' || matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app == 'backoffice' && 'ci-backoffice' || matrix.app }},mode=max

  # Sobe a imagem REAL da api com as mesmas restrições de produção (raiz só leitura, sem capabilities,
  # tmpfs) contra Postgres e Redis de serviço e confere o que o build sozinho não pega: migrations no
  # imagem `migrate` (como no compose, antes da api), boot, rota com banco e header de versão. (O PDF é
  # testado no job smoke-pdf.)
  smoke-api:
    name: Smoke da imagem da API
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'

      # Reaproveita o cache do job "Docker build (api)" (mesmo escopo); aqui só carrega a imagem.
      - name: Build da imagem (carregada no daemon)
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: segwise-api:ci
          build-args: |
            GIT_SHA=ci-${{ github.sha }}
          cache-from: type=gha,scope=api

      # A imagem das migrations (packages/database/Dockerfile) aplica todas as migrations no banco vazio,
      # com as mesmas restrições de produção. Depois a api sobe sobre o banco já migrado.
      - name: Build da imagem migrate (carregada no daemon)
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/database/Dockerfile
          load: true
          tags: segwise-migrate:ci
          cache-from: type=gha,scope=migrate

      - name: Migrations pela imagem migrate
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          out="$(docker run --rm --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64m \
            -e DATABASE_URL=postgresql://postgres:ci@localhost:5432/postgres \
            segwise-migrate:ci 2>&1)" || { echo "$out"; echo "::error::A imagem migrate falhou."; exit 1; }
          echo "$out" | tail -n 5
          grep -q "All migrations have been successfully applied" <<<"$out" \
            || { echo "::error::A imagem migrate não aplicou as migrations."; exit 1; }

      - name: Tamanho das imagens (resumo)
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          for img in segwise-api:ci segwise-migrate:ci; do
            {
              echo "### ${img}: $(docker image inspect "$img" --format '{{.Size}}' | awk '{printf "%.0f MB descomprimida", $1/1e6}')"
              echo '```'
              docker history --format '{{.Size}}\t{{.CreatedBy}}' "$img" | grep -v '^0B' | cut -c1-120
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Subir a api com as restrições de produção
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          cat > "$RUNNER_TEMP/api.env" <<'EOF'
          NODE_ENV=production
          PORT=3000
          APPLICATION_URL=http://localhost:3556
          BASE_URL=http://localhost:3000
          AUTH_SECRET=ci-secret-ci-secret-ci-secret-1234
          DATABASE_URL=postgresql://postgres:ci@localhost:5432/postgres
          CACHE_URL=redis://localhost:6379
          QUEUE_URL=redis://localhost:6379
          PDF_SERVICE_URL=http://localhost:3100
          PDF_SERVICE_TOKEN=ci-token-ci-token-1234
          AI_BASE_URL=http://localhost:1
          AI_MODEL=x
          AI_MODEL_VISION=x
          AI_API_KEY=x
          MINIO_ENDPOINT=http://localhost:9000
          MINIO_ACCESS_KEY=x
          MINIO_SECRET_KEY=x
          RESEND_API_KEY=re_ci
          APIPLACAS_TOKEN=x
          CPFCNPJ_TOKEN=x
          PLACA_FIPE_TOKEN=x
          AMOUNT_SEARCH_VEHICLE_COMPLETE=1
          TRANSFEERA_CLIENT_SECRET=x
          TRANSFEERA_CLIENT_SECRET_USER=x
          TRANSFEERA_PAYMENT_PIX_KEY=x
          TRANSFEERA_PAYMENT_SPLIT_PIX_TYPE=x
          TRANSFEERA_PAYMENT_SPLIT_PIX=x
          EOF
          docker run -d --name api --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=256m \
            --tmpfs /home/appuser/.cache:size=128m,uid=10001,gid=10001 \
            --env-file "$RUNNER_TEMP/api.env" \
            segwise-api:ci

      - name: Aguardar o boot
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/services/marketplace || true)"
            if [ "$code" = "200" ]; then echo "api respondeu 200 após ~$((i * 2))s"; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then break; fi
            sleep 2
          done
          echo "::error::A api não respondeu 200 em /services/marketplace (último HTTP ${code:-000})."
          exit 1

      - name: Header X-App-Version, sem CLI do Prisma e usuário não-root
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          version="$(curl -s -D - -o /dev/null http://localhost:3000/ | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')"
          expected="ci-${GITHUB_SHA}"
          echo "X-App-Version: ${version} (esperado ${expected})"
          [ "$version" = "$expected" ] || { echo "::error::X-App-Version não confere."; exit 1; }
          # As migrations são da imagem `migrate`: o CLI do Prisma não pode estar na imagem da api.
          if docker exec api sh -c 'ls -d /app/node_modules/.bun/prisma@* 2>/dev/null'; then
            echo "::error::O CLI do Prisma voltou para a imagem da api (ver scripts/prune-node-modules.ts)."; exit 1
          fi
          uid="$(docker exec api id -u)"
          [ "$uid" = "10001" ] || { echo "::error::A api não roda como uid 10001 (uid=$uid)."; exit 1; }
          echo "sem CLI do Prisma, uid ${uid}"

      # A extração de PDF por IA (libraries/ai/pdf-extraction.ts) usa o pdf-parse: pdfjs (worker carregado
      # em runtime, invisível ao `verify` do Dockerfile) e o canvas nativo (variante musl). Gera um PDF,
      # extrai o texto e renderiza a página como imagem dentro da imagem real.
      - name: pdf-parse (texto e imagem da página) dentro da imagem
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          docker exec api bun -e '
            const { PDFDocument, StandardFonts } = await import("pdf-lib");
            const { PDFParse } = await import("pdf-parse");
            const doc = await PDFDocument.create();
            const page = doc.addPage([300, 200]);
            page.drawText("Apolice 12345", { x: 20, y: 100, size: 18, font: await doc.embedFont(StandardFonts.Helvetica) });
            const parser = new PDFParse({ data: Buffer.from(await doc.save()) });
            const text = (await parser.getText()).pages.map((p) => p.text).join(" ");
            const shot = await parser.getScreenshot({ first: 1, desiredWidth: 300, imageDataUrl: true, imageBuffer: false });
            await parser.destroy();
            const img = shot.pages[0]?.dataUrl ?? "";
            console.log("texto:", JSON.stringify(text.trim()), "| imagem:", img.slice(0, 22), img.length, "chars");
            if (!text.includes("Apolice 12345") || !img.startsWith("data:image/png") || img.length < 500) process.exit(1);
          ' || { echo "::error::O pdf-parse não extraiu texto/imagem dentro da imagem da api."; exit 1; }

      # Fotos do marketplace (src/libraries/images/optimize-photo.ts): Bun.Image no Alpine/musl da imagem
      # real decodifica JPEG/PNG e grava WebP. Também confere o fallback (entrada inválida volta a original).
      - name: Bun.Image (otimização de fotos) dentro da imagem
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          docker exec api bun -e '
            const { optimizePhoto } = await import("/app/apps/api/src/libraries/images/optimize-photo.ts");
            const png = await Bun.file("/app/apps/api/src/templates/assets/images/logo-white.png").arrayBuffer();
            const jpeg = await new Bun.Image(png).jpeg({ quality: 90 }).bytes();
            const out = await optimizePhoto(jpeg.buffer, "image/jpeg");
            const meta = await new Bun.Image(out.bytes).metadata();
            console.log("jpeg", jpeg.byteLength, "bytes ->", out.type, out.bytes.byteLength, "bytes", JSON.stringify(meta));
            if (out.type !== "image/webp" || meta.format !== "webp") process.exit(1);
            const bad = await optimizePhoto(new Uint8Array([1, 2, 3]).buffer, "image/heic");
            console.log("entrada inválida ->", bad.type, bad.ext);
            if (bad.type !== "image/heic") process.exit(1);
          ' || { echo "::error::A otimização de fotos (Bun.Image) falhou dentro da imagem da api."; exit 1; }

      - name: Sem erros de permissão nos logs
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          if docker logs api 2>&1 | grep -iE 'EACCES|permission denied|EROFS|read-only file system'; then
            echo "::error::A api registrou erro de permissão/leitura (ver acima): falta um tmpfs ou volume no compose?"
            exit 1
          fi

      # Fila de marketing no cliente Redis nativo do Bun (createBunRedisClient): agenda e remove um
      # scheduler (como as campanhas) e põe um job real na fila; o worker da própria api tem de concluí-lo
      # (campanha inexistente: o processador retorna sem enviar nada). Prova comandos normais e bloqueantes.
      - name: Fila (BullMQ no Redis nativo do Bun)
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          docker exec api bun -e '
            const { createBunRedisClient, Queue } = await import("bullmq");
            const connection = createBunRedisClient(new Bun.RedisClient(process.env.QUEUE_URL));
            const queue = new Queue("marketing", { connection });
            const campaignId = crypto.randomUUID(); // campanha que não existe no banco
            await queue.upsertJobScheduler("smoke-scheduler", { every: 3_600_000 }, { name: "send-campaign", data: { campaignId } });
            const schedulers = await queue.getJobSchedulers();
            if (!schedulers.some((s) => s.key === "smoke-scheduler")) { console.error("scheduler não criado"); process.exit(1); }
            await queue.removeJobScheduler("smoke-scheduler");
            const job = await queue.add("send-campaign", { campaignId, manual: true });
            let state = "";
            for (let i = 0; i < 40; i++) {
              state = await (await queue.getJob(job.id)).getState();
              if (state === "completed" || state === "failed") break;
              await Bun.sleep(250);
            }
            const done = await queue.getJob(job.id);
            console.log("job", job.id, "->", state, JSON.stringify(done?.returnvalue ?? null));
            await queue.close();
            await connection.quit();
            if (state !== "completed") process.exit(1);
          ' || { echo "::error::A fila (BullMQ no Redis nativo do Bun) não processou o job."; exit 1; }

      # Como no deploy: SIGTERM e até 30 s. A api tem de sair sozinha, com código 0, pelo desligamento
      # gracioso (src/libraries/shutdown.ts), e não pelo SIGKILL do Docker.
      - name: Desligamento gracioso (SIGTERM)
        if: github.event_name != 'pull_request' || steps.changes.outputs.api == 'true'
        run: |
          start=$(date +%s)
          docker stop -t 30 api >/dev/null
          elapsed=$(( $(date +%s) - start ))
          code="$(docker inspect -f '{{.State.ExitCode}}' api)"
          logs="$(docker logs api 2>&1)"
          echo "saiu em ${elapsed}s com código ${code}"
          grep -q "\[shutdown\] concluído" <<<"$logs" || { echo "::error::A api não passou pelo desligamento gracioso."; echo "$logs" | tail -n 20; exit 1; }
          [ "$code" = "0" ] || { echo "::error::A api saiu com código ${code}."; exit 1; }
          [ "$elapsed" -lt 25 ] || { echo "::error::O desligamento levou ${elapsed}s."; exit 1; }

      - name: Logs da api (em caso de falha)
        if: failure()
        run: docker logs api 2>&1 | tail -n 80 || true

  # Sobe a imagem REAL do serviço de PDF como em produção: rede interna sem saída para a internet,
  # raiz só leitura, sem capabilities. Confere o que o build não pega: o Chromium sobe sob essas
  # restrições, a autenticação, a geração do PDF e que o container realmente não alcança a internet.
  smoke-pdf:
    name: Smoke da imagem do PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            pdf:
              - 'apps/pdf/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'

      # Reaproveita o cache do job "Docker build (pdf)" (mesmo escopo); aqui só carrega a imagem.
      - name: Build da imagem (carregada no daemon)
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/pdf/Dockerfile
          load: true
          tags: segwise-pdf:ci
          build-args: |
            GIT_SHA=ci-${{ github.sha }}
          cache-from: type=gha,scope=pdf

      - name: Tamanho da imagem (resumo)
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'
        run: |
          {
            echo "### Imagem do pdf: $(docker image inspect segwise-pdf:ci --format '{{.Size}}' | awk '{printf "%.0f MB descomprimida", $1/1e6}')"
            echo '```'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' segwise-pdf:ci | grep -v '^0B' | cut -c1-120
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Subir o pdf numa rede interna, com as restrições de produção
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'
        run: |
          docker network create --internal pdfnet
          docker run -d --name pdf --network pdfnet \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --shm-size 256m \
            --tmpfs /tmp:size=256m \
            -e PDF_TOKEN=ci-token-ci-token-1234 \
            segwise-pdf:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' pdf)" = "true" ] || break
            if docker run --rm --network pdfnet curlimages/curl:8.11.1 -sf http://pdf:3000/health >/dev/null; then
              echo "pdf saudável após ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::O serviço de PDF não ficou saudável."
          exit 1

      - name: Autenticação, PDF e uid não-root
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'
        run: |
          curl_in_net() { docker run --rm --network pdfnet curlimages/curl:8.11.1 "$@"; }
          body='{"html":"<html><body><h1>Proposta - acentuação ção</h1><img src=\"https://example.com/x.png\"></body></html>"}'

          code="$(curl_in_net -s -o /dev/null -w '%{http_code}' -X POST http://pdf:3000/render -d "$body")"
          [ "$code" = "401" ] || { echo "::error::Sem token devia dar 401 (deu $code)."; exit 1; }

          out="$(curl_in_net -s -X POST http://pdf:3000/render -H 'Authorization: Bearer ci-token-ci-token-1234' -d "$body" -D - -o /dev/null | tr -d '\r')"
          grep -qi '^HTTP/.* 200' <<<"$out" || { echo "::error::POST /render não deu 200:"; echo "$out"; exit 1; }
          grep -qi '^content-type: application/pdf' <<<"$out" || { echo "::error::Resposta não é PDF."; exit 1; }
          grep -qi "^x-app-version: ci-${GITHUB_SHA}" <<<"$out" || { echo "::error::X-App-Version não confere."; exit 1; }

          magic="$(curl_in_net -s -X POST http://pdf:3000/render -H 'Authorization: Bearer ci-token-ci-token-1234' -d "$body" | head -c 5)"
          [ "$magic" = "%PDF-" ] || { echo "::error::O corpo não começa com %PDF- (veio '$magic')."; exit 1; }

          uid="$(docker exec pdf id -u)"
          [ "$uid" = "1000" ] || { echo "::error::O pdf não roda como uid 1000 (uid=$uid)."; exit 1; }
          echo "pdf ok (401 sem token, PDF com token, uid ${uid})"

      # A rede é `--internal`: o container não pode alcançar a internet (nem a api, nem outro serviço).
      - name: Sem acesso à internet
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'
        run: |
          if docker exec pdf bun -e "fetch('https://example.com',{signal:AbortSignal.timeout(5000)}).then(()=>process.exit(0),()=>process.exit(1))"; then
            echo "::error::O container do pdf alcançou a internet; a rede interna não está isolando."
            exit 1
          fi
          echo "sem saída para a internet, como esperado"

      # Renderiza as 3 fixtures reais (apps/pdf/test/fixtures: cotação, propostas, contatos) nesta imagem
      # e na que está em produção (ghcr.io/segwise/pdf:latest) e compara pixel a pixel. Mudança de base,
      # navegador ou fontes que altere o visual aparece aqui antes de chegar ao usuário. Falha com páginas
      # em número diferente ou mais de 0,5% dos pixels diferentes; os PDFs e PNGs ficam como artefato.
      # Só em PR (na main, "produção" ainda é a imagem anterior até o CD terminar). Mudança visual
      # intencional, depois de revisada no artefato: label `pdf-visual-change` no PR (reporta sem falhar).
      - name: Comparação visual com a imagem em produção
        if: github.event_name == 'pull_request' && steps.changes.outputs.pdf == 'true'
        env:
          ACCEPT_VISUAL_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'pdf-visual-change') }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils imagemagick >/dev/null
          docker run -d --name pdf-prod --network pdfnet \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --shm-size 256m --tmpfs /tmp:size=256m \
            -e PDF_TOKEN=ci-token-ci-token-1234 \
            ghcr.io/segwise/pdf:latest
          for i in $(seq 1 30); do
            docker run --rm --network pdfnet curlimages/curl:8.11.1 -sf http://pdf-prod:3000/health >/dev/null && break
            sleep 1
          done

          out="$RUNNER_TEMP/visual"
          mkdir -p "$out" && chmod 777 "$out"
          failed=0
          {
            echo "### Comparação visual (esta imagem × produção)"
            echo "| fixture | páginas | pixels diferentes | fontes (esta) | fontes (produção) |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in quote safes contacts; do
            # "new" = esta imagem (container pdf), "prod" = produção (container pdf-prod).
            for side in new prod; do
              svc=pdf; [ "$side" = prod ] && svc=pdf-prod
              docker run --rm --network pdfnet \
                -v "$PWD/apps/pdf/test/fixtures:/fx:ro" -v "$out:/out" \
                curlimages/curl:8.11.1 -sf -X POST "http://${svc}:3000/render" \
                -H 'Authorization: Bearer ci-token-ci-token-1234' -H 'Content-Type: application/json' \
                --data-binary "@/fx/${f}.json" -o "/out/${f}-${side}.pdf"
              pdftoppm -r 72 -png "$out/${f}-${side}.pdf" "$out/${f}-${side}"
            done

            fonts_new="$(pdffonts "$out/${f}-new.pdf" | awk 'NR>2{print $1}' | sed 's/^[A-Z]*+//' | sort -u | paste -sd ' ')"
            fonts_prod="$(pdffonts "$out/${f}-prod.pdf" | awk 'NR>2{print $1}' | sed 's/^[A-Z]*+//' | sort -u | paste -sd ' ')"
            pages_new="$(ls "$out/${f}-new-"*.png | wc -l)"
            pages_prod="$(ls "$out/${f}-prod-"*.png | wc -l)"

            diff=0; total=0
            if [ "$pages_new" = "$pages_prod" ]; then
              for png in "$out/${f}-prod-"*.png; do
                page="${png##*-}"
                ae="$(compare -metric AE "$out/${f}-new-${page}" "$png" "$out/${f}-diff-${page}" 2>&1 || true)"
                diff=$((diff + ${ae%% *}))
                total=$((total + $(identify -format '%w*%h' "$png")))
              done
              pct="$(awk -v d="$diff" -v t="$total" 'BEGIN{printf "%.3f", 100*d/t}')"
              awk -v p="$pct" 'BEGIN{exit !(p>0.5)}' && failed=1
            else
              pct="páginas diferentes"; failed=1
            fi

            echo "| ${f} | ${pages_new} × ${pages_prod} | ${pct}% | ${fonts_new} | ${fonts_prod} |" >> "$GITHUB_STEP_SUMMARY"
            echo "${f}: páginas ${pages_new}×${pages_prod}, ${pct}% dos pixels diferentes; fontes [${fonts_new}] × [${fonts_prod}]"
          done

          if [ "$failed" != 0 ]; then
            if [ "$ACCEPT_VISUAL_CHANGE" = "true" ]; then
              echo "::warning::Os PDFs diferem dos de produção; aceito pela label pdf-visual-change."
            else
              echo "::error::Os PDFs desta imagem diferem dos de produção (ver o resumo e o artefato pdf-visual). Se a mudança é intencional, adicione a label pdf-visual-change ao PR."
              exit 1
            fi
          fi

      - name: PDFs da comparação visual (artefato)
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.pdf == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pdf-visual
          path: ${{ runner.temp }}/visual
          if-no-files-found: ignore
          retention-days: 7

      - name: Sem erros de permissão nos logs
        if: github.event_name != 'pull_request' || steps.changes.outputs.pdf == 'true'
        run: |
          if docker logs pdf 2>&1 | grep -iE 'EACCES|permission denied|EROFS|read-only file system'; then
            echo "::error::O pdf registrou erro de permissão/leitura: falta um tmpfs no compose?"
            exit 1
          fi

      - name: Logs do pdf (em caso de falha)
        if: failure()
        run: docker logs pdf 2>&1 | tail -n 80 || true

  # Sobe a imagem REAL do backoffice (a mesma das 3 variantes) com as restrições de produção e confere
  # que o Node e o Next sobem: o build sozinho não pega uma biblioteca do sistema que falte no runtime.
  smoke-web:
    name: Smoke da imagem do backoffice
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            web:
              - 'apps/backoffice/**'
              - 'packages/core/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'

      # Mesmos build args do job "Docker build (backoffice)": reaproveita o cache dele.
      - name: Build da imagem (carregada no daemon)
        if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backoffice/Dockerfile
          load: true
          tags: segwise-web:ci
          build-args: |
            NEXT_PUBLIC_ROLE_SYSTEM=admin
            NEXT_PUBLIC_API_URL=http://localhost:3000
            GIT_SHA=ci-${{ github.sha }}
          cache-from: type=gha,scope=ci-backoffice

      - name: Tamanho da imagem (resumo)
        if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: |
          {
            echo "### Imagem do backoffice: $(docker image inspect segwise-web:ci --format '{{.Size}}' | awk '{printf "%.0f MB descomprimida", $1/1e6}')"
            echo '```'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' segwise-web:ci | grep -v '^0B' | cut -c1-120
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Subir com as restrições de produção e conferir o Next
        if: github.event_name != 'pull_request' || steps.changes.outputs.web == 'true'
        run: |
          docker run -d --name web -p 3000:3000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:size=64m \
            --tmpfs /app/apps/backoffice/.next/cache:size=256m,uid=1000,gid=1000 \
            -e NODE_ENV=production -e PORT=3000 -e HOSTNAME=0.0.0.0 \
            -e NEXT_PUBLIC_API_URL=http://localhost:3000 -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-1234 \
            segwise-web:ci
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/sign-in || true)"
            if [ -n "$code" ] && [ "$code" != "000" ]; then break; fi
            [ "$(docker inspect -f '{{.State.Running}}' web)" = "true" ] || break
            sleep 1
          done
          echo "GET /sign-in -> HTTP ${code}"
          case "$code" in 2??|3??) ;; *) echo "::error::O backoffice não respondeu 2xx/3xx em /sign-in (HTTP ${code:-000})."; exit 1 ;; esac
          # X-App-Version vem do proxy, em tempo de execução (o CD confere este header em "/").
          version="$(curl -s -D - -o /dev/null http://localhost:3000/ | tr -d '\r' | awk -F': ' 'tolower($1)=="x-app-version"{print $2}')"
          echo "X-App-Version: ${version}"
          [ "$version" = "ci-${GITHUB_SHA}" ] || { echo "::error::X-App-Version não confere (esperado ci-${GITHUB_SHA})."; exit 1; }
          # Arquivos de public/ sem sessão (fora do proxy) e o otimizador do next/image sobre eles (usa o
          # sharp/libvips da imagem).
          for path in '/images/logo.png' '/_next/image?url=%2Fimages%2Flogo.png&w=64&q=100'; do
            res="$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:3000${path}")"
            echo "GET ${path} -> ${res}"
            case "$res" in "200 image/"*) ;; *) echo "::error::${path} não devolveu imagem (${res})."; exit 1 ;; esac
          done
          # O sharp (libvips nativo, usado pelo otimizador do next/image) carrega e gera uma imagem com a
          # variante musl que ficou no standalone.
          docker exec -w /app/apps/backoffice web bun -e "
            const sharp = require(require.resolve('sharp', { paths: [require.resolve('next/package.json')] }));
            sharp({ create: { width: 8, height: 8, channels: 3, background: '#fff' } }).webp().toBuffer()
              .then((b) => console.log('sharp ok,', b.length, 'bytes'), (e) => { console.error(e); process.exit(1); });
          " || { echo "::error::O sharp (next/image) não carregou no runtime."; exit 1; }
          uid="$(docker exec web id -u)"
          [ "$uid" = "1000" ] || { echo "::error::O backoffice não roda como uid 1000 (uid=$uid)."; exit 1; }
          echo "bun $(docker exec web bun --version), uid ${uid}"
          # Runtime é o Bun, sem Node de verdade: a imagem do Bun só traz um `node` que aponta para o próprio
          # bun (bun-node-fallback-bin, para scripts com `#!/usr/bin/env node`). Nada de npm/yarn/corepack.
          if docker exec web sh -c 'command -v npm || command -v npx || command -v yarn || command -v corepack'; then
            echo "::error::Gerenciador de pacotes presente no runtime."; exit 1
          fi
          docker exec web sh -c 'n="$(command -v node)" || exit 0; [ "$(readlink -f "$n")" = "$(readlink -f "$(command -v bun)")" ]' \
            || { echo "::error::Há um binário de Node de verdade no runtime."; exit 1; }
          # Rota protegida sem sessão: o proxy manda para o /sign-in com o callbackUrl.
          loc="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:3000/dashboard)"
          echo "GET /dashboard -> ${loc}"
          case "$loc" in "307 http://localhost:3000/sign-in?callbackUrl=%2Fdashboard") ;; *) echo "::error::O proxy não redirecionou /dashboard para o login (${loc})."; exit 1 ;; esac
          # Um chunk JS que a página de login referencia (servido pelo Next, fora do proxy).
          chunk="$(curl -s http://localhost:3000/sign-in | grep -oE '/_next/static/[^"]+\.js' | head -n 1)"
          res="$(curl -s -o /dev/null -w '%{http_code} %{content_type}' "http://localhost:3000${chunk}")"
          echo "GET ${chunk} -> ${res}"
          case "$res" in "200 application/javascript"*|"200 text/javascript"*) ;; *) echo "::error::Chunk estático não foi servido (${res})."; exit 1 ;; esac
          # O healthcheck do compose (deploy/docker-compose.yml, x-web-healthcheck) dentro do container.
          docker exec web bun -e "fetch('http://127.0.0.1:3000/sign-in',{redirect:'manual'}).then((r)=>process.exit(r.status<500?0:1),()=>process.exit(1))" \
            || { echo "::error::O healthcheck do compose falha dentro do container."; exit 1; }
          if docker logs web 2>&1 | grep -iE 'EACCES|permission denied|EROFS|read-only file system|Error loading shared library'; then
            echo "::error::Erro de permissão ou biblioteca nos logs do backoffice."; exit 1
          fi

      - name: Logs do backoffice (em caso de falha)
        if: failure()
        run: docker logs web 2>&1 | tail -n 80 || true

  compose:
    name: Compose (deploy/)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q

      # Toda ${VAR} usada no compose precisa estar documentada em deploy/.env.example
      # (as opcionais entram comentadas). Linhas de comentário do compose são ignoradas.
      - name: Variáveis do compose documentadas
        run: |
          missing=0
          while read -r v; do
            if ! grep -qE "^#?[[:space:]]*${v}=" deploy/.env.example; then
              echo "::error file=deploy/.env.example::${v} é usada em deploy/docker-compose.yml mas não está documentada"
              missing=1
            fi
          done < <(grep -v '^[[:space:]]*#' deploy/docker-compose.yml | grep -oE '\$\{[A-Z_][A-Z0-9_]*' | sed 's/\${//' | sort -u)
          exit "$missing"

  # Único check obrigatório na branch protection: passa se nenhum job falhou.
  ci:
    name: CI
    if: always()
    needs: [verify, database, docker, smoke-api, smoke-pdf, smoke-web, compose]
    runs-on: ubuntu-24.04
    steps:
      - name: Todos os jobs passaram?
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
