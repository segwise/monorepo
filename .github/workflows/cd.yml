name: CD

# Depois que o CI passa na main: builda as imagens, publica no GHCR e manda o Dokploy
# puxar a nova versão. Também pode ser disparado à mão (deploy ou rollback de um SHA).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit a buildar e publicar (vazio = HEAD da main)'
        required: false
        type: string
      deploy:
        description: 'Disparar o deploy no Dokploy depois de publicar'
        required: false
        type: boolean
        default: true

# Um deploy por vez; um novo run espera o anterior terminar (não cancela deploy em andamento).
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Resolver commit
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      image_prefix: ${{ steps.resolve.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || 'main' }}
      - id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=${sha}"
            echo "tag=sha-${sha:0:7}"
            # GHCR exige minúsculas
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

  images:
    name: Imagem (${{ matrix.name }})
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build_args: ''
          - name: backoffice
            dockerfile: apps/backoffice/Dockerfile
            build_args: NEXT_PUBLIC_ROLE_SYSTEM=admin
          - name: customer
            dockerfile: apps/backoffice/Dockerfile
            build_args: NEXT_PUBLIC_ROLE_SYSTEM=customer
          - name: producer
            dockerfile: apps/backoffice/Dockerfile
            build_args: NEXT_PUBLIC_ROLE_SYSTEM=producer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Exigir NEXT_PUBLIC_API_URL (apps Next)
        if: ${{ matrix.name != 'api' && vars.NEXT_PUBLIC_API_URL == '' }}
        run: |
          echo '::error::Defina a variável de repositório NEXT_PUBLIC_API_URL (URL pública da API): ela é embutida no build do backoffice.'
          exit 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.meta.outputs.image_prefix }}/${{ matrix.name }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image_prefix }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}
          # NEXT_PUBLIC_* é embutido no build do Next: a URL da API vem de uma variável do repositório.
          build-args: |
            ${{ matrix.build_args }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy (Dokploy compose)
    needs: [meta, images]
    # Só roda com o Dokploy configurado e (no disparo manual) se o deploy foi pedido.
    if: ${{ vars.DOKPLOY_URL != '' && vars.DOKPLOY_COMPOSE_ID != '' && (github.event_name != 'workflow_dispatch' || inputs.deploy) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}

      # O compose (deploy/docker-compose.yml) usa as imagens :latest com pull_policy: always:
      # o deploy baixa a versão que acabou de ser publicada e recria só o que mudou.
      - name: Deploy no Dokploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: bash scripts/dokploy-deploy.sh

  # Aviso (não falha) quando o Dokploy ainda não está configurado.
  deploy-skipped:
    name: Deploy ignorado
    needs: [meta, images]
    if: ${{ vars.DOKPLOY_URL == '' || vars.DOKPLOY_COMPOSE_ID == '' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice::DOKPLOY_URL e/ou DOKPLOY_COMPOSE_ID não definidas; imagens publicadas, deploy não disparado."
