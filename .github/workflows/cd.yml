name: CD

# Depois que o CI passa na main: builda as imagens, publica no GHCR e manda o Dokploy
# puxar a nova versão. Também pode ser disparado à mão (deploy ou rollback de um SHA).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit a buildar e publicar (vazio = HEAD da main)'
        required: false
        type: string
      deploy:
        description: 'Disparar o deploy no Dokploy depois de publicar'
        required: false
        type: boolean
        default: true

# Um deploy por vez; um novo run espera o anterior terminar (não cancela deploy em andamento).
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    name: Resolver commit
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      image_prefix: ${{ steps.resolve.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || 'main' }}
      - id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          {
            echo "sha=${sha}"
            echo "tag=sha-${sha:0:7}"
            # GHCR exige minúsculas
            echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

  images:
    name: Imagem (${{ matrix.name }})
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            build_args: ''
          - name: backoffice
            dockerfile: apps/backoffice/Dockerfile
            build_args: NEXT_PUBLIC_ROLE_SYSTEM=admin
          - name: customer
            dockerfile: apps/backoffice/Dockerfile
            build_args: NEXT_PUBLIC_ROLE_SYSTEM=customer
          - name: producer
            dockerfile: apps/backoffice/Dockerfile
            build_args: NEXT_PUBLIC_ROLE_SYSTEM=producer
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - name: Exigir NEXT_PUBLIC_API_URL (apps Next)
        if: ${{ matrix.name != 'api' && vars.NEXT_PUBLIC_API_URL == '' }}
        run: |
          echo '::error::Defina a variável de repositório NEXT_PUBLIC_API_URL (URL pública da API): ela é embutida no build do backoffice.'
          exit 1

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ needs.meta.outputs.image_prefix }}/${{ matrix.name }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.image_prefix }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.sha }}
          # NEXT_PUBLIC_* é embutido no build do Next: a URL da API vem de uma variável do repositório.
          build-args: |
            ${{ matrix.build_args }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy (Dokploy compose)
    needs: [meta, images]
    # No disparo manual dá para só publicar as imagens (deploy: false).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    runs-on: ubuntu-24.04
    # O script espera o deploy do Dokploy (até 15 min) e as URLs (até 4 min por URL).
    timeout-minutes: 30
    environment: production
    # URL e composeId também são segredos: o repo é público, e segredos são mascarados nos logs
    # (o contexto `secrets` não existe no `if` do job, por isso a checagem é um passo).
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
    steps:
      # Nenhum segredo definido = Dokploy ainda não configurado (só avisa). Parcial = erro.
      - id: config
        name: Verificar configuração do Dokploy
        run: |
          set=0
          for name in DOKPLOY_URL DOKPLOY_API_KEY COMPOSE_ID; do
            if [ -n "${!name}" ]; then set=$((set + 1)); fi
          done
          if [ "$set" -eq 3 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$set" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Segredos do Dokploy não definidos; imagens publicadas, deploy não disparado."
          else
            echo "::error::Configuração parcial: defina os três segredos DOKPLOY_URL, DOKPLOY_COMPOSE_ID e DOKPLOY_API_KEY."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          ref: ${{ needs.meta.outputs.sha }}

      # O compose (deploy/docker-compose.yml) usa as imagens :latest com pull_policy: always:
      # o deploy baixa a versão que acabou de ser publicada e recria só o que mudou. O script
      # dispara o deploy, ESPERA o Dokploy terminar (falha se terminar em erro) e testa as URLs.
      - name: Deploy no Dokploy e verificação
        if: ${{ steps.config.outputs.configured == 'true' }}
        env:
          # URLs públicas (separadas por espaço) que devem responder < 500 após o deploy.
          # Variável do repo (não segredo: são sites públicos); vazia = só espera o Dokploy.
          HEALTHCHECK_URLS: ${{ vars.HEALTHCHECK_URLS }}
        run: bash scripts/dokploy-deploy.sh
