# Mantém atualizados, por PR (que passa pelo CI), o que envelhece sem ninguém ver:
#  - os digests das imagens base dos Dockerfiles (patches de segurança do Alpine/Debian);
#  - as versões das GitHub Actions.
# As dependências npm/bun ficam de fora de propósito: o lockfile é do Bun e os catalogs
# (React por plataforma) pedem revisão manual.
#
# Ignorados de propósito (cada um já gerou um PR que não devia ser aceito como veio):
#  - oven/bun: o Bun é o runtime de todas as imagens (api, backoffice, migrate e pdf) e a versão
#    também está fixada no `packageManager` (package.json) e no CI (`bun-version`). Subir só o Dockerfile deixaria runtime, CI e lockfile em versões diferentes:
#    atualize os quatro de uma vez, à mão, e teste a api.
version: 2
updates:
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: oven/bun

  - package-ecosystem: docker
    directory: /apps/backoffice
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: oven/bun

  - package-ecosystem: docker
    directory: /apps/pdf
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: oven/bun

  - package-ecosystem: docker
    directory: /packages/database
    schedule:
      interval: weekly
    labels: [dependencies, docker]
    ignore:
      - dependency-name: oven/bun

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
