# Stack de produção no Dokploy (um compose só): api + 3 variantes do backoffice + Redis de cache.
#
# FORA deste compose, como Databases do Dokploy (ciclo de vida e backup independentes do deploy):
#   - Postgres  → DATABASE_URL
#   - Redis da fila do BullMQ (persistente, AOF + noeviction) → QUEUE_URL
# Aqui só fica o que é descartável: o cache (e, se um dia precisar de pub/sub, um serviço
# novo ao lado do cache).
#
# As imagens vêm do GHCR (publicadas pelo CD). `latest` + `pull_policy: always`: cada
# `docker compose up -d` baixa a versão nova e só recria os serviços cuja imagem mudou.
# Rollback: rodar o CD com o `sha` desejado, que republica `latest`.
#
# As variáveis do Dokploy (aba Environment) são gravadas num .env ao lado deste arquivo e NÃO
# vão sozinhas para os containers: cada uma é referenciada abaixo com ${VAR}.
# Lista completa em deploy/.env.example.

name: segwise

x-web-environment: &web-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'
  PORT: '3000'
  # O Next standalone escuta em HOSTNAME; no Docker o padrão é o id do container.
  HOSTNAME: 0.0.0.0
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
  # O servidor do Next (SSR, proxy, server actions) fala com a api pela rede interna `api-web`, sem ir ao
  # Cloudflare e voltar. O navegador continua usando NEXT_PUBLIC_API_URL (ver src/libraries/api-url.ts).
  API_INTERNAL_URL: http://segwise-api:3000/services
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}

x-web-healthcheck: &web-healthcheck
  # O runtime das imagens web é o Bun (apps/backoffice/Dockerfile): não há `node` no container.
  test:
    - CMD
    - bun
    - -e
    - "fetch('http://127.0.0.1:3000/sign-in',{redirect:'manual'}).then((r)=>process.exit(r.status<500?0:1),()=>process.exit(1))"
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

# Hardening de runtime (todos os serviços): sem capabilities, sem elevação de privilégio e sistema de
# arquivos só leitura. Os caminhos que precisam gravar são `tmpfs` (somem a cada reinício).
x-hardening: &hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  read_only: true

services:
  api:
    <<: *hardening
    image: ghcr.io/segwise/api:latest
    pull_policy: always
    restart: unless-stopped
    # No deploy a api recebe SIGTERM e encerra com calma (requisições em andamento, job da fila de
    # marketing devolvido à fila, conexões fechadas; ver apps/api/src/libraries/shutdown.ts). O padrão
    # do Docker é 10 s antes do SIGKILL; a api força a saída aos 25 s.
    stop_grace_period: 30s
    # tmpfs com teto de tamanho: sem `size`, um tmpfs pode chegar a metade da RAM do servidor.
    tmpfs:
      - /tmp:size=256m
      - /home/appuser/.cache:size=128m,uid=10001,gid=10001
    depends_on:
      cache:
        condition: service_healthy
      pdf:
        condition: service_healthy
      # Só sobe (ou é recriada) depois de as migrations terminarem com sucesso. Se uma migration falhar,
      # o `docker compose up` para aí: a api da versão anterior continua no ar.
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Serviço de PDF (rede pdf-network, sem saída para a internet).
      PDF_SERVICE_URL: http://pdf:3000
      PDF_SERVICE_TOKEN: ${PDF_TOKEN:?defina PDF_TOKEN (openssl rand -hex 32) nas variáveis do Dokploy}
      APPLICATION_URL: ${APPLICATION_URL}
      # Sem CUSTOMER_PORTAL_URL o código usa APPLICATION_URL (e vazio não passa na validação de URL).
      CUSTOMER_PORTAL_URL: ${CUSTOMER_PORTAL_URL:-${APPLICATION_URL}}
      BASE_URL: ${BASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      # Postgres e Redis da fila são Databases do Dokploy (fora deste compose): use o host
      # interno e a senha que o Dokploy mostra em cada um (a api já está na dokploy-network).
      DATABASE_URL: ${DATABASE_URL}
      QUEUE_URL: ${QUEUE_URL}
      CACHE_URL: redis://cache:6379
      AI_BASE_URL: ${AI_BASE_URL}
      AI_MODEL: ${AI_MODEL}
      # Vazio = usa AI_MODEL (o código trata com ||).
      AI_MODEL_VISION: ${AI_MODEL_VISION:-}
      AI_API_KEY: ${AI_API_KEY}
      # Estes três são numéricos e lidos com ??: vazio viraria 0. Defaults = os do código.
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-45000}
      AI_MAX_TEXT_CHARS: ${AI_MAX_TEXT_CHARS:-80000}
      AI_MAX_COMPLETION_TOKENS: ${AI_MAX_COMPLETION_TOKENS:-2200}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      APIPLACAS_TOKEN: ${APIPLACAS_TOKEN}
      CPFCNPJ_TOKEN: ${CPFCNPJ_TOKEN}
      PLACA_FIPE_TOKEN: ${PLACA_FIPE_TOKEN}
      AMOUNT_SEARCH_VEHICLE_COMPLETE: ${AMOUNT_SEARCH_VEHICLE_COMPLETE}
      TRANSFEERA_CLIENT_SECRET: ${TRANSFEERA_CLIENT_SECRET}
      TRANSFEERA_CLIENT_SECRET_USER: ${TRANSFEERA_CLIENT_SECRET_USER}
      TRANSFEERA_PAYMENT_PIX_KEY: ${TRANSFEERA_PAYMENT_PIX_KEY}
      TRANSFEERA_PAYMENT_SPLIT_PIX_TYPE: ${TRANSFEERA_PAYMENT_SPLIT_PIX_TYPE}
      TRANSFEERA_PAYMENT_SPLIT_PIX: ${TRANSFEERA_PAYMENT_SPLIT_PIX}
      IOS_APP_URL: ${IOS_APP_URL}
      ANDROID_APP_URL: ${ANDROID_APP_URL}
      IOS_XCAR_APP_URL: ${IOS_XCAR_APP_URL}
      ANDROID_XCAR_APP_URL: ${ANDROID_XCAR_APP_URL}
    healthcheck:
      # Qualquer resposta HTTP (até 404) = processo de pé.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      internal-network: {}
      pdf-network: {}
      # Apelido exclusivo: na dokploy-network outros projetos podem ter um serviço chamado `api`.
      api-web-network:
        aliases: [segwise-api]
      dokploy-network: {}

  # Migrations do banco (`prisma migrate deploy`), uma vez a cada deploy, antes da api. Imagem própria
  # (packages/database/Dockerfile): a api não carrega o CLI do Prisma. Sem migration pendente, só
  # confere e termina. Na dokploy-network porque o Postgres é um Database do Dokploy.
  migrate:
    <<: *hardening
    image: ghcr.io/segwise/migrate:latest
    pull_policy: always
    restart: 'no'
    tmpfs:
      - /tmp:size=64m
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - dokploy-network

  # HTML -> PDF (Chromium + Playwright), separado da api: imagem própria que quase nunca muda e
  # isolamento de rede. Só a api o alcança, por uma rede `internal: true` (sem saída para a internet,
  # sem Traefik). O HTML que a api envia já é autossuficiente (CSS embutido e imagens `data:`).
  pdf:
    <<: *hardening
    image: ghcr.io/segwise/pdf:latest
    pull_policy: always
    restart: unless-stopped
    # /dev/shm: o Chromium divide memória entre processos (padrão do Docker = 64 MB). Tetos de memória e
    # de processos: um PDF descontrolado derruba só este serviço (que reinicia), não o servidor nem a api.
    shm_size: 256m
    mem_limit: 1536m
    pids_limit: 256
    tmpfs:
      - /tmp:size=256m
    environment:
      NODE_ENV: production
      PORT: '3000'
      PDF_TOKEN: ${PDF_TOKEN:?defina PDF_TOKEN (openssl rand -hex 32) nas variáveis do Dokploy}
      MAX_CONCURRENCY: '4'
    healthcheck:
      # Runtime Bun (apps/pdf/Dockerfile): não há `node` no container.
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pdf-network

  backoffice:
    <<: *hardening
    image: ghcr.io/segwise/backoffice:latest
    pull_policy: always
    restart: unless-stopped
    # Único caminho que o Next grava em runtime é o cache (uid 1000 = usuário `bun` da imagem).
    tmpfs:
      - /tmp:size=64m
      - /app/apps/backoffice/.next/cache:size=256m,uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *web-environment
      NEXT_PUBLIC_ROLE_SYSTEM: admin
    healthcheck: *web-healthcheck
    networks:
      - api-web-network
      - dokploy-network

  customer:
    <<: *hardening
    image: ghcr.io/segwise/customer:latest
    pull_policy: always
    restart: unless-stopped
    # Único caminho que o Next grava em runtime é o cache (uid 1000 = usuário `bun` da imagem).
    tmpfs:
      - /tmp:size=64m
      - /app/apps/backoffice/.next/cache:size=256m,uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *web-environment
      NEXT_PUBLIC_ROLE_SYSTEM: customer
    healthcheck: *web-healthcheck
    networks:
      - api-web-network
      - dokploy-network

  producer:
    <<: *hardening
    image: ghcr.io/segwise/producer:latest
    pull_policy: always
    restart: unless-stopped
    # Único caminho que o Next grava em runtime é o cache (uid 1000 = usuário `bun` da imagem).
    tmpfs:
      - /tmp:size=64m
      - /app/apps/backoffice/.next/cache:size=256m,uid=1000,gid=1000
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *web-environment
      NEXT_PUBLIC_ROLE_SYSTEM: producer
    healthcheck: *web-healthcheck
    networks:
      - api-web-network
      - dokploy-network

  # Cache e sessões do better-auth: só expulsa chaves com TTL (preserva as consultas pagas de CPF/CNPJ
  # sem TTL, por isso mantém AOF e volume nomeado — que também aceita Volume Backup do Dokploy).
  cache:
    <<: *hardening
    # Roda direto como o usuário `redis` da imagem (sem root e sem capabilities): o entrypoint oficial só
    # troca de usuário quando começa como root, e isso exigiria SETUID/SETGID/SETPCAP. O volume nomeado
    # `cache-data` já pertence a esse usuário (foi o redis que escreveu os dados).
    user: '999:999'
    image: redis:8
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --save
      - '60'
      - '1'
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - cache-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal-network

networks:
  internal-network:
    driver: bridge
    internal: true
  # Só api e pdf. `internal: true` = sem rota para a internet.
  pdf-network:
    driver: bridge
    internal: true
  # api + backoffice/customer/producer: o servidor do Next chama a api por aqui (http://segwise-api:3000).
  # `internal: true`: sem rota para a internet; o Traefik e a saída para a internet seguem pela dokploy-network.
  api-web-network:
    driver: bridge
    internal: true
  dokploy-network:
    external: true

volumes:
  cache-data:
